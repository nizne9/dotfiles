<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <description>Humanist Kai: Ysabeau Office + LXGW WenKai GB composite</description>

  <!-- Ysabeau Office is local to the authoring machine; machines without it
       fall through to LXGW WenKai GB. -->
  <match target="pattern">
    <test qual="any" name="family"><string>Humanist Kai</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Ysabeau Office</string>
      <string>LXGW WenKai GB</string>
      <string>Noto Color Emoji</string>
      <string>Source Han Sans CN</string>
    </edit>
  </match>
</fontconfig>
