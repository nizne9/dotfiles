# foot config
# font, cursor, window styling; colors via upstream theme include

[main]
font=FiraCode Nerd Font Mono Ret:size=10
font-feature=calt
gamma-correct-blending=yes
pad=1x1
include=/usr/share/foot/themes/catppuccin-mocha

[bell]
system=no

[csd]
preferred=none

[cursor]
style=beam
blink=yes

[mouse]
hide-when-typing=yes

[scrollback]
lines=10000
