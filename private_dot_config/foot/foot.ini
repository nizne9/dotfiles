# foot config
# font, cursor, window styling; colors via upstream theme include

[main]
font=FiraCode Nerd Font Mono:size=10:weight=450
line-height=1.2
pad=1x1
decoration=none
sixel=true
include=/usr/share/foot/themes/catppuccin-mocha

[cursor]
style=beam
blink=yes

[mouse]
hide-when-typing=yes

[scrollback]
lines=10000
