# systemd user manager 启动时读取，影响所有 user-scope 服务和 D-Bus 激活的服务。
# Niri 不会把 `environment {}` 节点的变量传给 systemd 域，所以在这里设置 XDG_DATA_DIRS，
# 让 portable-daemon 等 D-Bus 激活的服务能扫到 /usr/share/applications。
# 用 ${VAR:-default} 防止覆盖系统已有值，附加 Flatpak 路径以兼容未来安装。
XDG_DATA_DIRS=${XDG_DATA_DIRS:-/usr/local/share/:/usr/share/}:/var/lib/flatpak/exports/share:${HOME}/.local/share/flatpak/exports/share
