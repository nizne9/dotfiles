# Qt theming for systemd user services / D-Bus activated apps.
# Moved here from niri's environment {} block so that processes started
# outside of niri's direct spawn chain (systemd user services, D-Bus
# activated apps, xdg-autostart) also pick up gtk3-style Qt theming.
#
# Note: LANG is intentionally NOT here — it stays in niri's environment {}
# so that only niri-spawned GUI applications get zh_CN.UTF-8 while system
# tools, shell commands, and journalctl output keep the en_US.UTF-8 locale
# from /etc/locale.conf (better for parsing, tooling, error messages).
QT_QPA_PLATFORMTHEME=gtk3
