# Input method environment for systemd user services / D-Bus activated apps.
# fcitx5 is launched via xdg autostart. XWayland and SDL2 apps need these
# explicitly; native Wayland GTK uses text-input, so GTK_IM_MODULE stays unset.
XMODIFIERS=@im=fcitx
SDL_IM_MODULE=fcitx

# Qt5 (and Qt < 6.8.2) need the fcitx module. Qt 6.8.2+ prefers native
# Wayland text-input and falls back to fcitx.
QT_IM_MODULE=fcitx
QT_IM_MODULES="wayland;fcitx"
